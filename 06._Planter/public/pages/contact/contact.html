<h1>Contact</h1>

<p>Submit a message below if you have any questions or feedback.</p>

<form action="/api/contact" method="POST">
    <fieldset>
        <legend>Contact us</legend>

        <label for="topic">Topic</label>
        <input id="topic" name="topic" required maxlength="100">

        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required maxlength="100">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="15" cols="60" required maxlength="5000"></textarea>

        <button type="submit">Contact</button>
    </fieldset>
</form>
